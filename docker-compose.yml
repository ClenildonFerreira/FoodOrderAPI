version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: foodorder_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root@123
      - POSTGRES_DB=foodorderdb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
